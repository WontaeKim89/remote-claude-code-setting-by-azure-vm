#cloud-config
# VM 최초 부팅 시 자동 실행되는 초기 설정.
# - 필수 패키지 (tmux, node, claude, bun, bubblewrap/socat) 설치
# - bwrap AppArmor profile 적용 (Ubuntu 24.04 unprivileged userns 정책 우회)
# - linger 활성화 → 사용자 로그인 없이도 부팅 시 user systemd 기동
#
# systemd user unit / launch script / telegram trigger 같은 동적 자산은
# 이 cloud-init 이 아니라 start-remote.sh (또는 후속 scp 자동화) 가 배포한다.
# 이유: 빈번히 갱신되는 자산을 cloud-init 에 두면 새 VM 만 적용 받고 기존 VM 은
# custom_data 변경에 의한 강제 재생성을 피하고 있어서 동기화가 어긋난다.

package_update: true
package_upgrade: true

packages:
  - git
  - curl
  - tmux
  - unzip
  # claude remote-control 의 sandbox 의존성. 미설치면 모바일 새 세션 생성이
  # "Allocating sandbox..." 단계에서 무한 대기.
  - bubblewrap
  - socat

runcmd:
  # ── 선결: /home/azureuser 소유권 보정 ────────────────────────
  # Ubuntu 24.04 + Azure Linux Agent 조합에서 cloud-init runcmd 시점에
  # /home/azureuser가 root 소유로 남아있는 현상 발견.
  # → 이후 `su - azureuser -c ...`가 권한 거부로 실패하므로 먼저 정리한다.
  - chown azureuser:azureuser /home/azureuser

  # ── bubblewrap unprivileged userns 허용 (Ubuntu 24.04 AppArmor 정책) ────
  # 24.04 부터 kernel.apparmor_restrict_unprivileged_userns=1 이 기본값이라
  # bwrap 가 user namespace 만들 때 "setting up uid map: Permission denied"
  # 로 실패. 결과적으로 claude remote-control 모바일 새 세션이
  # "Allocating sandbox..." 단계에서 무한 대기.
  # → bwrap 에 unconfined + userns 권한을 부여하는 AppArmor profile 을 박는다.
  - |
    cat > /etc/apparmor.d/bwrap <<'APPARMOR'
    abi <abi/4.0>,
    include <tunables/global>

    profile bwrap /usr/bin/bwrap flags=(unconfined) {
      userns,
      include if exists <local/bwrap>
    }
    APPARMOR
  - systemctl reload apparmor

  # ── 패키지: Node.js / Claude Code / Bun ────────────────────
  - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
  - apt-get install -y nodejs
  - npm install -g @anthropic-ai/claude-code
  - su - azureuser -c 'curl -fsSL https://bun.sh/install | bash'
  - su - azureuser -c 'mkdir -p ~/project'

  # ── 런타임 디렉토리 + linger ────────────────────────────────
  - mkdir -p /home/azureuser/.local/share/claude-remote /home/azureuser/.config/claude-remote /home/azureuser/.local/bin /home/azureuser/.config/systemd/user
  - chown -R azureuser:azureuser /home/azureuser/.local /home/azureuser/.config
  - loginctl enable-linger azureuser

  # 이후 단계 (systemd unit, launch script, telegram-trigger 배포 + claude 로그인
  # + GitHub SSH key 등록 + sessions registry 초기화 + Telegram notifier.env 배포)
  # 는 start-remote.sh 한 번 실행으로 처리된다.
